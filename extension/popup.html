<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AccessiBuild</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="container">
    <header>
      <span class="eyebrow">ACCESSIBILITY TOOLKIT</span>
      <h1>AccessiBuild</h1>
      <p>Adapt the current webpage to your preferred accessibility profile.</p>
    </header>

    <label for="profile">Choose a profile</label>
    <select id="profile">
      <option value="normal">Normal</option>
      <option value="low_vision">Low Vision</option>
      <option value="dyslexia">Dyslexia Friendly</option>
      <option value="adhd">ADHD Focus</option>
      <option value="autism">Sensory Friendly</option>
      <option value="motor">Motor Support</option>
      <option value="elder">Easy Read</option>
      <option value="photosensitive">No Motion</option>
    </select>

    <div class="actions">
      <button id="apply" class="primary">Apply profile</button>
      <button id="reset" class="secondary">Reset</button>
    </div>

    <button id="analyze" class="ai">Analyze page with AI</button>
    <p id="status" role="status" aria-live="polite"></p>
    <pre id="analysis" hidden></pre>
  </main>
  <script src="profiles.js"></script>
  <script src="popup.js"></script>
</body>
</html>
